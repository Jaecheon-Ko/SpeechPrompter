<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e5e5e5;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { color: #ffd23f; font-size: 24px; margin: 0; }
  p { color: #9a9a9a; font-size: 15px; line-height: 1.6; margin: 0; }
  button { margin-top: 8px; padding: 16px 28px; background: #ffd23f; color: #000; border: 0;
    border-radius: 14px; font-size: 18px; font-weight: 800; font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙 음성 프롬프터</h1>
  <p>인터넷에 연결할 수 없습니다.<br>Wi-Fi 또는 모바일 데이터를 확인한 뒤 다시 시도해 주세요.</p>
  <button onclick="location.href='https://voice-prompter-kr.lovable.app/'">다시 시도</button>
</div>
</body>
</html>
